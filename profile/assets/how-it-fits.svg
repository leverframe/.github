<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">How Leverframe fits together</title>
  <desc id="d">Coding agents such as Claude Code and Codex are supervised by wranglebot's deterministic guardrails. Their tool calls reach the OpenClaw gateway and Hermes agent runtimes through fleet-bridge, one stdio MCP server where every lever is gated and audited. Tractum verifies multi-agent consensus with signed k-of-n receipts. Cabinet-lite reads across the whole fleet as a read-only signal box: what needs you, who's free, what happened.</desc>
  <style>
    .bg { fill: #f8f9f8; }
    .panel { fill: #eef1ee; stroke: #c4cec7; stroke-width: 1.5; }
    .frame { fill: #eef1ee; stroke: #b07d0a; stroke-width: 2.5; }
    .line { stroke: #66736c; stroke-width: 2; fill: none; }
    .read { stroke: #5a7a2e; stroke-width: 2; fill: none; stroke-dasharray: 6 6; opacity: .8; }
    .arrow { fill: #66736c; }
    .slot { stroke: #c4cec7; stroke-width: 7; stroke-linecap: round; }
    .rail { stroke: #b07d0a; stroke-width: 2; opacity: .55; }
    .knob-a { fill: #b07d0a; }
    .knob-g { fill: #5a7a2e; }
    .pill { fill: #f8f9f8; stroke: #b07d0a; stroke-width: 1.5; }
    text { fill: #2d353b; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    .h { font-size: 13px; fill: #66736c; letter-spacing: .3px; }
    .name { font-size: 17px; }
    .big { font-size: 22px; }
    .sub { font-size: 12.5px; fill: #66736c; }
    .tag { font-size: 15px; font-weight: 600; }
    .lic { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; fill: #66736c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e2327; }
      .panel { fill: #272e33; stroke: #3d484d; }
      .frame { fill: #272e33; stroke: #dbbc7f; }
      .line { stroke: #859289; }
      .read { stroke: #a7c080; }
      .arrow { fill: #859289; }
      .slot { stroke: #3d484d; }
      .rail { stroke: #dbbc7f; }
      .knob-a { fill: #dbbc7f; }
      .knob-g { fill: #a7c080; }
      .pill { fill: #1e2327; stroke: #dbbc7f; }
      text { fill: #d3c6aa; }
      .h, .sub { fill: #859289; }
      .lic { fill: #859289; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="640" rx="16"/>

  <!-- column headings -->
  <text class="h" x="150" y="44" text-anchor="middle">Coding agents</text>
  <text class="h" x="480" y="44" text-anchor="middle">The interlocking</text>
  <text class="h" x="810" y="44" text-anchor="middle">Agent runtimes</text>

  <!-- clients -->
  <rect class="panel" x="50" y="66" width="200" height="56" rx="10"/>
  <text class="mono name" x="150" y="100" text-anchor="middle">Claude Code</text>
  <rect class="panel" x="50" y="136" width="200" height="56" rx="10"/>
  <text class="mono name" x="150" y="170" text-anchor="middle">Zed / other</text>

  <!-- runtimes -->
  <rect class="panel" x="710" y="66" width="200" height="56" rx="10"/>
  <text class="mono name" x="810" y="100" text-anchor="middle">OpenClaw gateway</text>
  <rect class="panel" x="710" y="136" width="200" height="56" rx="10"/>
  <text class="mono name" x="810" y="170" text-anchor="middle">Hermes</text>

  <!-- connectors: clients -> bridge -> runtimes -->
  <path class="line" d="M252 94 L368 118" marker-end="url(#ah)"/>
  <path class="line" d="M252 164 L368 142" marker-end="url(#ah)"/>
  <path class="line" d="M592 118 L708 94" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="line" d="M592 142 L708 164" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- fleet-bridge: the lever frame -->
  <rect class="frame" x="370" y="58" width="220" height="188" rx="12"/>
  <text class="mono big" x="480" y="90" text-anchor="middle">fleet-bridge</text>
  <text class="sub" x="480" y="110" text-anchor="middle">one stdio MCP server</text>

  <line class="rail" x1="404" y1="134" x2="556" y2="134"/>
  <g>
    <line class="slot" x1="414" y1="138" x2="414" y2="178"/><circle class="knob-g" cx="414" cy="174" r="8"/>
    <line class="slot" x1="447" y1="138" x2="447" y2="178"/><circle class="knob-a" cx="447" cy="142" r="8"/>
    <line class="slot" x1="480" y1="138" x2="480" y2="178"/><circle class="knob-g" cx="480" cy="174" r="8"/>
    <line class="slot" x1="513" y1="138" x2="513" y2="178"/><circle class="knob-g" cx="513" cy="174" r="8"/>
    <line class="slot" x1="546" y1="138" x2="546" y2="178"/><circle class="knob-a" cx="546" cy="142" r="8"/>
  </g>
  <text class="sub" x="480" y="206" text-anchor="middle">every lever gated and audited —</text>
  <text class="sub" x="480" y="224" text-anchor="middle">no two can conflict</text>
  <text class="lic" x="576" y="76" text-anchor="end">MIT</text>

  <!-- wranglebot: supervises the coding agents -->
  <rect class="panel" x="50" y="280" width="430" height="118" rx="10"/>
  <text class="mono name" x="72" y="308">wranglebot</text>
  <text class="lic" x="458" y="308" text-anchor="end">BUSL-1.1</text>
  <text class="sub" x="72" y="332">Rides with coding agents: deterministic guardrails,</text>
  <text class="sub" x="72" y="350">loop-breaking, and session records they can't bypass.</text>
  <text class="sub" x="72" y="368">When an agent wedges, wranglebot trips it — deterministically.</text>

  <path class="line" d="M150 280 L150 196" marker-end="url(#ah)"/>

  <!-- tractum: verifies the multi-agent layer -->
  <rect class="panel" x="480" y="280" width="430" height="118" rx="10"/>
  <text class="mono name" x="502" y="308">tractum</text>
  <text class="lic" x="888" y="308" text-anchor="end">BUSL-1.1</text>
  <text class="sub" x="502" y="332">Verifiable multi-agent consensus for Claude: signed</text>
  <text class="sub" x="502" y="350">k-of-n receipts bound to transcript evidence, so you</text>
  <text class="sub" x="502" y="368">can prove what the fleet actually agreed on.</text>

  <path class="line" d="M810 280 L810 196" marker-end="url(#ah)"/>

  <!-- cabinet-lite: reads the whole board -->
  <rect class="frame" x="50" y="436" width="860" height="132" rx="12"/>
  <text class="mono name" x="72" y="466">cabinet-lite</text>
  <text class="lic" x="888" y="466" text-anchor="end">MIT</text>
  <text class="sub" x="72" y="490">The signal box made software — a read-only dashboard across the whole fleet.</text>
  <text class="sub" x="72" y="508">It answers the three questions that matter: what needs you, who's free,</text>
  <text class="sub" x="72" y="526">and what just happened. Reads the board; never drives the levers.</text>

  <path class="read" d="M480 246 L480 432" marker-end="url(#ah)"/>
  <path class="read" d="M265 402 L265 432" marker-end="url(#ah)"/>
  <path class="read" d="M695 402 L695 432" marker-end="url(#ah)"/>

  <!-- tagline -->
  <text class="tag" x="480" y="604" text-anchor="middle">Two agent runtimes. One MCP interface. One signal box. Every lever gated.</text>
</svg>
